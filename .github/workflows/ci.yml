name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'run-ci'))
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Start work budget
        shell: bash
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        run: go vet ./...
      - name: Affected Go unit packages
        shell: bash
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
        run: |-
          set -euo pipefail
          module=$(go list -m)
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
          go list -f '{{.ImportPath}} {{join .Deps " "}} {{join .TestImports " "}} {{join .XTestImports " "}}' ./... > "$RUNNER_TEMP/go-packages"
          python3 - "$module" "$RUNNER_TEMP" <<'PYGO'
          import pathlib, sys
          module, temp = sys.argv[1], pathlib.Path(sys.argv[2])
          paths = (temp / 'changed-paths').read_text().splitlines()
          changed = {
              module if pathlib.PurePosixPath(p).parent == pathlib.PurePosixPath('.')
              else module + '/' + str(pathlib.PurePosixPath(p).parent)
              for p in paths if p.endswith('.go')
          }
          all_packages = any(p in {'go.mod', 'go.sum'} for p in paths)
          rows = [row.split() for row in (temp / 'go-packages').read_text().splitlines()]
          dependencies = {row[0]: set(row[1:]) for row in rows}
          packages = []
          for package, direct in dependencies.items():
              deps = direct.copy()
              pending = list(direct)
              while pending:
                  extra = dependencies.get(pending.pop(), set()) - deps
                  deps.update(extra)
                  pending.extend(extra)
              if package == module + '/db' or package.startswith(module + '/internal/store'):
                  continue
              if all_packages or changed.intersection([package, *deps]):
                  packages.append('./' if package == module else package)
          (temp / 'affected-go').write_text('\n'.join(packages))
          PYGO
          mapfile -t packages < "$RUNNER_TEMP/affected-go"
          if [[ ${#packages[@]} -gt 0 ]]; then go test -p 2 -count=1 "${packages[@]}"; fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Web format and lint
        working-directory: web
        run: pnpm lint
      - name: Web types
        working-directory: web
        run: pnpm typecheck
      - name: Affected unit tests
        shell: bash
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
        run: pnpm exec vitest run --changed "$BASE_SHA" --passWithNoTests --maxWorkers=2
        working-directory: web
      - name: Validate OpenAPI document
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml
      - name: Work budget (300 seconds)
        if: always()
        shell: bash
        run: |-
          elapsed=$(( $(date +%s) - VERIFY_STARTED ))
          echo "verify: ${elapsed}s / 300s"
          [[ $elapsed -le 300 ]]
