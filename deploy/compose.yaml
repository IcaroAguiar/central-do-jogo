services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-central_do_jogo}
      POSTGRES_USER: ${POSTGRES_USER:-central}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-central_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      STATIC_DIR: /app/web/dist
      DATABASE_URL: postgres://${POSTGRES_USER:-central}:${POSTGRES_PASSWORD:-central_dev_only}@db:5432/${POSTGRES_DB:-central_do_jogo}?sslmode=disable
      SHUTDOWN_TIMEOUT_MS: "15000"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-}
      MAINTAINER_ALLOWLIST: ${MAINTAINER_ALLOWLIST:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/app/worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-central}:${POSTGRES_PASSWORD:-central_dev_only}@db:5432/${POSTGRES_DB:-central_do_jogo}?sslmode=disable
      SHUTDOWN_TIMEOUT_MS: "15000"

volumes:
  pgdata:
